<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mondaine Stop2Go + Calendari</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
        display: flex;
        flex-direction: row;
        height: 100vh;
    }

    /* Layout responsive */
    @media (max-width: 768px) {
        body {
            flex-direction: column;
        }
    }

    /* Contenidor principal */
    .clock-container, .calendar-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* Rellotge */
    .clock {
        width: 300px;
        height: 300px;
        border: 8px solid black;
        border-radius: 50%;
        position: relative;
        background: white;
    }

    .center-dot {
        width: 12px;
        height: 12px;
        background: black;
        border-radius: 50%;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
    }

    .hand {
        position: absolute;
        width: 50%;
        height: 4px;
        background: black;
        top: 50%;
        transform-origin: 100%;
        transform: rotate(0deg);
    }

    .minute-hand {
        height: 4px;
        background: black;
    }

    .hour-hand {
        height: 6px;
        background: black;
        width: 35%;
    }

    /* Segonera Mondaine */
    .second-hand {
        height: 3px;
        background: red;
    }

    .second-circle {
        width: 18px;
        height: 18px;
        background: red;
        border-radius: 50%;
        position: absolute;
        right: -9px;
        top: -7px;
    }

    /* Calendari */
    .calendar {
        width: 320px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .calendar h2 {
        text-align: center;
        margin: 0 0 10px 0;
    }

    .weekdays, .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
    }

    .weekdays div {
        font-weight: bold;
        padding: 5px 0;
    }

    .days div {
        padding: 10px 0;
        border-radius: 6px;
    }

    .today {
        background: red;
        color: white;
        font-weight: bold;
    }

    /* Info meteorològica */
    .info-box {
        margin-top: 15px;
        padding: 10px;
        background: #eee;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="clock-container">
    <div class="clock">
        <div class="center-dot"></div>
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand">
            <div class="second-circle"></div>
        </div>
    </div>
</div>

<div class="calendar-container">
    <div class="calendar" id="calendar"></div>
</div>

<script>
/* ---------------------------
   Rellotge Mondaine Stop2Go
----------------------------*/
let minute = null;
let second = null;

function updateClock() {
    const now = new Date();
    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds() + now.getMilliseconds() / 1000;

    // STOP2GO: 58s de moviment + 2s pausa
    let stop2goSeconds = (s % 60);

    if (stop2goSeconds <= 58) {
        // Moviment continu
        second = (stop2goSeconds / 58) * 360;
    } else {
        // Pausa de 2s a les 12
        second = 360;
        // Minut salta només quan entra a la pausa
        if (minute !== m) {
            minute = m;
        }
    }

    // Minutera i hora
    const minuteAngle = (m + (stop2goSeconds <= 58 ? stop2goSeconds/58 : 0)) * 6;
    const hourAngle = (h % 12) * 30 + m * 0.5;

    document.getElementById("secondHand").style.transform = `rotate(${second}deg)`;
    document.getElementById("minuteHand").style.transform = `rotate(${minuteAngle}deg)`;
    document.getElementById("hourHand").style.transform = `rotate(${hourAngle}deg)`;

    requestAnimationFrame(updateClock);
}

updateClock();

/* ---------------------------
   Calendari mensual
----------------------------*/
function generateCalendar() {
    const calendar = document.getElementById("calendar");
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();

    const firstDay = new Date(year, month, 1);
    const startDay = (firstDay.getDay() + 6) % 7; // Dilluns = 0

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = `<h2>${now.toLocaleString("ca-ES", { month: "long" })} ${year}</h2>`;
    html += `<div class="weekdays">
                <div>Dill</div><div>Dim</div><div>Dmc</div>
                <div>Dij</div><div>Dvd</div><div>Dst</div><div>Dmg</div>
             </div><div class="days">`;

    for (let i = 0; i < startDay; i++) html += `<div></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === now.getDate();
        html += `<div class="${isToday ? "today" : ""}">${d}</div>`;
    }

    html += `</div>`;
    html += `<div class="info-box" id="weatherBox">Carregant dades...</div>`;

    calendar.innerHTML = html;
}

generateCalendar();

/* ---------------------------
   Temperatura i altitud
   (Open-Meteo API)
----------------------------*/
navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&elevation=true`;

    const data = await fetch(url).then(r => r.json());

    const temp = data.current_weather.temperature;
    const elev = data.elevation;

    document.getElementById("weatherBox").innerHTML =
        `Temperatura: <b>${temp}°C</b><br>Altitud: <b>${elev} m</b>`;
});
</script>

</body>
</html>
