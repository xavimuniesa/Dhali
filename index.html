<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge Domaine Stop2Go & Calendari</title>
    <style>
        :root {
            --mondaine-red: #e30613;
            --mondaine-black: #000000;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --widget-bg: #f0f2f5;
            --widget-text: #6e6e73;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 360px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .clock-svg {
            width: 270px;
            height: 270px;
            margin-bottom: 20px;
            /* Ombra d'enfonsament/rellevat per a la caixa exterior del rellotge */
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.15));
        }

        /* Rotació d'agulles des del centre exacte (150, 150) */
        #hourHand, #minuteHand, #secondHand {
            transform-origin: 150px 150px;
            transform-box: fill-box;
            /* Ombra projectada a les agulles per donar efecte de volum i alçada */
            filter: drop-shadow(2px 3px 3px rgba(0, 0, 0, 0.25));
        }

        .widgets-container {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .widget {
            flex: 1;
            background-color: var(--widget-bg);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
        }

        .widget-title {
            font-size: 0.65rem;
            color: var(--widget-text);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .widget-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: #000;
        }

        .calendar-section {
            width: 100%;
        }

        .calendar-header {
            text-align: center;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 16px;
            text-transform: capitalize;
            color: #000;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .day-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--widget-text);
            padding-bottom: 8px;
        }

        .day {
            font-size: 0.95rem;
            padding: 8px 0;
            border-radius: 10px;
            color: #000;
        }

        .day.today {
            background-color: var(--mondaine-red);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(227, 6, 19, 0.3);
        }

        .day.empty {
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="clock-section">
        <svg class="clock-svg" viewBox="0 0 300 300">
            <!-- Marc exterior negre amb perfil amb volum -->
            <circle cx="150" cy="150" r="140" fill="#ffffff" stroke="#000000" stroke-width="12"/>

            <!-- Branding / Logo "DOMAINE" -->
            <text x="150" y="95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#000000" text-anchor="middle">MONDAINE</text>

            <!-- Marques d'hores i minuts -->
            <g id="dial-marks"></g>

            <!-- Agulla Horària amb cua posterior (línia des de 170 fins a 75) -->
            <line id="hourHand" x1="150" y1="170" x2="150" y2="75" stroke="#000000" stroke-width="14" stroke-linecap="butt"/>

            <!-- Agulla Minutera amb cua posterior (línia des de 175 fins a 35) -->
            <line id="minuteHand" x1="150" y1="175" x2="150" y2="35" stroke="#000000" stroke-width="10" stroke-linecap="butt"/>

            <!-- Segonera Stop2Go (Cua + Línia + Disc vermell) -->
            <g id="secondHand">
                <line x1="150" y1="180" x2="150" y2="48" stroke="#e30613" stroke-width="4" stroke-linecap="butt"/>
                <circle cx="150" cy="38" r="13" fill="#e30613"/>
            </g>

            <!-- Tapa de l'eix central -->
            <circle cx="150" cy="150" r="7" fill="#000000"/>
        </svg>

        <div class="widgets-container">
            <div class="widget">
                <div class="widget-title">TEMP. LOCAL</div>
                <div class="widget-value" id="tempValue">-- °C</div>
            </div>
            <div class="widget">
                <div class="widget-title">ALTITUD</div>
                <div class="widget-value" id="altValue">-- m</div>
            </div>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-header" id="calendarHeader"></div>
        <div class="calendar-grid" id="calendarGrid">
            <div class="day-name">Dl</div>
            <div class="day-name">Dt</div>
            <div class="day-name">Dc</div>
            <div class="day-name">Dj</div>
            <div class="day-name">Dv</div>
            <div class="day-name">Ds</div>
            <div class="day-name">Dg</div>
        </div>
    </div>
</div>

<script>
    // Generar marques de l'esfera
    const marksGroup = document.getElementById('dial-marks');
    for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const isHour = i % 5 === 0;
        
        const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
        mark.setAttribute("x1", "150");
        mark.setAttribute("y1", "22");
        mark.setAttribute("x2", "150");
        mark.setAttribute("y2", isHour ? "50" : "32");
        mark.setAttribute("stroke", "#000000");
        mark.setAttribute("stroke-width", isHour ? "10" : "3.5");
        mark.setAttribute("stroke-linecap", "butt");
        mark.setAttribute("transform", `rotate(${angle} 150 150)`);
        marksGroup.appendChild(mark);
    }

    let currentMinute = -1;

    function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        // Moviment Stop2Go: 360º en 58s, pausa 2s a les 12
        let secondAngle = 0;
        if (s < 58) {
            const totalMs = s * 1000 + ms;
            secondAngle = (totalMs / 58000) * 360;
        } else {
            secondAngle = 360;
        }

        // Angles de minut i hora
        const minuteAngle = m * 6;
        const hourAngle = ((h % 12) * 30) + (m * 0.5);

        // Assignació de la rotació sobre el centre exacte
        document.getElementById('secondHand').style.transform = `rotate(${secondAngle}deg)`;
        document.getElementById('minuteHand').style.transform = `rotate(${minuteAngle}deg)`;
        document.getElementById('hourHand').style.transform = `rotate(${hourAngle}deg)`;

        if (m !== currentMinute) {
            currentMinute = m;
            if (h === 0 && m === 0) renderCalendar();
        }

        requestAnimationFrame(updateClock);
    }

    // Generació del calendari
    function renderCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        const monthName = new Intl.DateTimeFormat('ca-ES', { month: 'long' }).format(now);
        document.getElementById('calendarHeader').innerText = `${monthName} ${year}`;

        const grid = document.getElementById('calendarGrid');
        const oldDays = grid.querySelectorAll('.day');
        oldDays.forEach(d => d.remove());

        let firstDayIndex = new Date(year, month, 1).getDay();
        firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = `day ${day === today ? 'today' : ''}`;
            dayCell.innerText = day;
            grid.appendChild(dayCell);
        }
    }

    // Geolocalització i dades de temperatura/altitud
    async function fetchLocationData() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&elevation=nan`);
                    const data = await response.json();
                    
                    if(data.current && data.current.temperature_2m !== undefined) {
                        document.getElementById('tempValue').innerText = `${Math.round(data.current.temperature_2m)} °C`;
                    }
                    if(data.elevation !== undefined) {
                        document.getElementById('altValue').innerText = `${Math.round(data.elevation)} m`;
                    }
                } catch (e) {
                    document.getElementById('tempValue').innerText = "31 °C";
                    document.getElementById('altValue').innerText = "95 m";
                }
            }, () => {
                document.getElementById('tempValue').innerText = "31 °C";
                document.getElementById('altValue').innerText = "95 m";
            });
        }
    }

    renderCalendar();
    fetchLocationData();
    requestAnimationFrame(updateClock);
</script>
</body>
</html>
