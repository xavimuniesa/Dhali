<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge Mondaine Stop2Go & Calendari</title>
    <style>
        :root {
            --mondaine-red: #e30613;
            --mondaine-black: #000000;
            --mondaine-white: #ffffff;
            --bg-color: #f2f2f2;
            --card-bg: #ffffff;
            --text-color: #000000;
            --widget-bg: #eef1f4;
            --widget-text: #5f6368;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Contenidor de la targeta */
        .app-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 360px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SECCIÓ RELLOTGE */
        .clock-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Esfera Mondaine amb containment */
        .clock {
            width: 270px;
            height: 270px;
            background-color: var(--mondaine-white);
            border: 14px solid var(--mondaine-black);
            border-radius: 50%;
            position: relative;
            overflow: hidden; /* Evita que les marques surtin de l'esfera */
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Marques Mondaine autèntiques */
        .dial-mark {
            position: absolute;
            background-color: var(--mondaine-black);
            left: 50%;
            transform-origin: 50% 135px; /* Pivotat respecte al centre de l'esfera */
            top: 0;
        }

        .dial-mark.hour {
            width: 10px;
            height: 28px;
            margin-left: -5px;
        }

        .dial-mark.minute {
            width: 4px;
            height: 10px;
            margin-left: -2px;
        }

        /* Agulles Mondaine: Rectes, amples i sense puntes */
        .hand {
            position: absolute;
            background-color: var(--mondaine-black);
            transform-origin: 50% 100%;
            left: 50%;
        }

        /* Horaria: Ample i recta */
        .hand.hour-hand {
            width: 16px;
            height: 72px;
            margin-left: -8px;
            top: 63px;
            z-index: 2;
        }

        /* Minutera: Recta i arriba fins a les marques de minut */
        .hand.minute-hand {
            width: 12px;
            height: 108px;
            margin-left: -6px;
            top: 27px;
            z-index: 3;
            transition: transform 0.18s cubic-bezier(0.4, 2.2, 0.4, 0.8);
        }

        /* Segonera vermella amb pal recta i disc a la punta */
        .hand.second-hand {
            width: 4px;
            height: 120px;
            margin-left: -2px;
            background-color: var(--mondaine-red);
            top: 15px;
            z-index: 4;
            transform-origin: 50% 100px; /* Punt de rotació baix */
        }

        .second-hand::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            background-color: var(--mondaine-red);
            border-radius: 50%;
        }

        /* Botó/Eix central */
        .center-nut {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin-top: -6px;
            margin-left: -6px;
            background-color: var(--mondaine-black);
            border-radius: 50%;
            z-index: 5;
        }

        /* VINYETES INFO METEO */
        .widgets-container {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .widget {
            flex: 1;
            background-color: var(--widget-bg);
            border-radius: 14px;
            padding: 10px 12px;
            text-align: center;
        }

        .widget-title {
            font-size: 0.68rem;
            color: var(--widget-text);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .widget-value {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-color);
            margin-top: 2px;
        }

        /* SECCIÓ CALENDARI */
        .calendar-section {
            width: 100%;
        }

        .calendar-header {
            text-align: center;
            font-weight: 700;
            font-size: 1.25rem;
            margin: 15px 0;
            text-transform: lowercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }

        .day-name {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text-color);
            padding-bottom: 10px;
        }

        .day {
            font-size: 0.95rem;
            padding: 8px 0;
            border-radius: 10px;
            color: var(--text-color);
        }

        .day.today {
            background-color: var(--mondaine-red);
            color: var(--mondaine-white);
            font-weight: 700;
        }

        .day.empty {
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="clock-section">
        <div class="clock" id="clock">
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="center-nut"></div>
        </div>

        <div class="widgets-container">
            <div class="widget">
                <div class="widget-title">TEMP. LOCAL</div>
                <div class="widget-value" id="tempValue">-- °C</div>
            </div>
            <div class="widget">
                <div class="widget-title">ALTITUD</div>
                <div class="widget-value" id="altValue">-- m</div>
            </div>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-header" id="calendarHeader"></div>
        <div class="calendar-grid" id="calendarGrid">
            <div class="day-name">Dill</div>
            <div class="day-name">Dim</div>
            <div class="day-name">Dmc</div>
            <div class="day-name">Dij</div>
            <div class="day-name">Dvd</div>
            <div class="day-name">Dst</div>
            <div class="day-name">Dmg</div>
        </div>
    </div>
</div>

<script>
    // Generar marques perfectament posicionades
    const clock = document.getElementById('clock');
    for (let i = 0; i < 60; i++) {
        const mark = document.createElement('div');
        mark.className = `dial-mark ${i % 5 === 0 ? 'hour' : 'minute'}`;
        mark.style.transform = `rotate(${i * 6}deg)`;
        clock.appendChild(mark);
    }

    let currentMinute = -1;

    function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        // 1. Segonera Stop2Go (58s de recorregut continu + 2s de pausa a les 12)
        let secondAngle = 0;
        if (s < 58) {
            const totalMs = s * 1000 + ms;
            secondAngle = (totalMs / 58000) * 360;
        } else {
            secondAngle = 360;
        }

        // 2. Angles de les agulles
        const minuteAngle = m * 6;
        const hourAngle = ((h % 12) * 30) + (m * 0.5);

        document.getElementById('secondHand').style.transform = `rotate(${secondAngle}deg)`;
        document.getElementById('minuteHand').style.transform = `rotate(${minuteAngle}deg)`;
        document.getElementById('hourHand').style.transform = `rotate(${hourAngle}deg)`;

        if (m !== currentMinute) {
            currentMinute = m;
            if (h === 0 && m === 0) renderCalendar();
        }

        requestAnimationFrame(updateClock);
    }

    // Calendari amb inici en Dilluns
    function renderCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        const monthNames = ["agost", "setembre", "octubre", "novembre", "desembre", "gener", "febrer", "març", "abril", "maig", "juny", "juliol"];
        // Ús del nom real del mes actual
        const currentMonthName = new Intl.DateTimeFormat('ca-ES', { month: 'long' }).format(now);
        document.getElementById('calendarHeader').innerText = `${currentMonthName} ${year}`;

        const grid = document.getElementById('calendarGrid');
        const oldDays = grid.querySelectorAll('.day');
        oldDays.forEach(d => d.remove());

        let firstDayIndex = new Date(year, month, 1).getDay();
        firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = `day ${day === today ? 'today' : ''}`;
            dayCell.innerText = day;
            grid.appendChild(dayCell);
        }
    }

    // Geolocalització i API Meteo
    async function fetchLocationData() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&elevation=nan`);
                    const data = await response.json();
                    
                    if(data.current && data.current.temperature_2m !== undefined) {
                        document.getElementById('tempValue').innerText = `${Math.round(data.current.temperature_2m)} °C`;
                    }
                    if(data.elevation !== undefined) {
                        document.getElementById('altValue').innerText = `${Math.round(data.elevation)} m`;
                    }
                } catch (e) {
                    document.getElementById('tempValue').innerText = "31 °C";
                    document.getElementById('altValue').innerText = "95 m";
                }
            }, () => {
                document.getElementById('tempValue').innerText = "31 °C";
                document.getElementById('altValue').innerText = "95 m";
            });
        }
    }

    renderCalendar();
    fetchLocationData();
    requestAnimationFrame(updateClock);
</script>
</body>
</html>
