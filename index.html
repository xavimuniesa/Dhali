<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mondaine Stop2Go</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
        display: flex;
        flex-direction: row;
        height: 100vh;
    }

    @media (max-width: 768px) {
        body { flex-direction: column; }
    }

    .clock-container, .calendar-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* Rellotge Mondaine */
    .clock {
        width: 320px;
        height: 320px;
        border: 10px solid black;
        border-radius: 50%;
        position: relative;
        background: white;
    }

    /* Ticks */
    .tick {
        position: absolute;
        width: 4px;
        height: 18px;
        background: black;
        left: 50%;
        top: 50%;
        transform-origin: center -140px;
    }

    .tick.small {
        height: 10px;
        width: 2px;
        transform-origin: center -150px;
    }

    /* Centre */
    .center-dot {
        width: 14px;
        height: 14px;
        background: black;
        border-radius: 50%;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
    }

    /* Agulles */
    .hand {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: 0% 50%;
        transform: rotate(0deg);
    }

    .hour-hand {
        width: 90px;
        height: 6px;
        background: black;
        border-radius: 3px;
        margin-left: -3px;
    }

    .minute-hand {
        width: 130px;
        height: 4px;
        background: black;
        border-radius: 2px;
        margin-left: -2px;
    }

    .second-hand {
        width: 140px;
        height: 3px;
        background: red;
        border-radius: 2px;
        margin-left: -1.5px;
    }

    .second-circle {
        width: 20px;
        height: 20px;
        background: red;
        border-radius: 50%;
        position: absolute;
        right: -10px;
        top: -8px;
    }

    /* Calendari */
    .calendar {
        width: 330px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .calendar h2 {
        text-align: center;
        margin: 0 0 10px 0;
    }

    .weekdays, .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
    }

    .weekdays div {
        font-weight: bold;
        padding: 5px 0;
    }

    .days div {
        padding: 10px 0;
        border-radius: 6px;
    }

    .today {
        background: red;
        color: white;
        font-weight: bold;
    }

    .info-box {
        margin-top: 15px;
        padding: 10px;
        background: #eee;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="clock-container">
    <div class="clock" id="clock">
        <div class="center-dot"></div>

        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand">
            <div class="second-circle"></div>
        </div>
    </div>
</div>

<div class="calendar-container">
    <div class="calendar" id="calendar"></div>
</div>

<script>
/* ---------------------------
   Ticks Mondaine
----------------------------*/
const clock = document.getElementById("clock");
for (let i = 0; i < 60; i++) {
    const tick = document.createElement("div");
    tick.className = "tick" + (i % 5 !== 0 ? " small" : "");
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(tick);
}

/* ---------------------------
   Rellotge Stop2Go
----------------------------*/
function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds() + now.getMilliseconds() / 1000;

    const stop2go = s % 60;

    let secondAngle;
    let minuteAngle;

    if (stop2go <= 58) {
        secondAngle = (stop2go / 58) * 360;
        minuteAngle = m * 6 + (stop2go / 58) * 6;
    } else {
        secondAngle = 360;
        minuteAngle = (m + 1) * 6;
    }

    const hourAngle = (h % 12) * 30 + m * 0.5;

    document.getElementById("secondHand").style.transform = `rotate(${secondAngle}deg)`;
    document.getElementById("minuteHand").style.transform = `rotate(${minuteAngle}deg)`;
    document.getElementById("hourHand").style.transform = `rotate(${hourAngle}deg)`;

    requestAnimationFrame(updateClock);
}

updateClock();

/* ---------------------------
   Calendari
----------------------------*/
function generateCalendar() {
    const calendar = document.getElementById("calendar");
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();

    const firstDay = new Date(year, month, 1);
    const startDay = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = `<h2>${now.toLocaleString("ca-ES", { month: "long" })} ${year}</h2>`;
    html += `<div class="weekdays">
                <div>Dill</div><div>Dim</div><div>Dmc</div>
                <div>Dij</div><div>Dvd</div><div>Dst</div><div>Dmg</div>
             </div><div class="days">`;

    for (let i = 0; i < startDay; i++) html += `<div></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === now.getDate();
        html += `<div class="${isToday ? "today" : ""}">${d}</div>`;
    }

    html += `</div>`;
    html += `<div class="info-box" id="weatherBox">Carregant dades...</div>`;

    calendar.innerHTML = html;
}

generateCalendar();

/* ---------------------------
   Meteo + Altitud
----------------------------*/
navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&elevation=true`;
    const data = await fetch(url).then(r => r.json());

    const temp = data.current_weather.temperature;
    const elev = data.elevation;

    document.getElementById("weatherBox").innerHTML =
        `Temperatura: <b>${temp}°C</b><br>Altitud: <b>${elev} m</b>`;
});
</script>

</body>
</html>
