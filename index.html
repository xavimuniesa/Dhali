<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge Estació Suïssa - Stop2Go</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
            }
        }

        /* Rellotge */
        .clock-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .clock {
            width: 300px;
            height: 300px;
            border: 12px solid #000;
            border-radius: 50%;
            position: relative;
            background: white;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .clock-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .marker {
            position: absolute;
            width: 4px;
            height: 15px;
            background: #000;
            left: 50%;
            transform-origin: 50% 150px;
            transform: translateX(-50%);
        }

        .marker.hour {
            width: 6px;
            height: 20px;
        }

        .center-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            transform-origin: 50% 100%;
            bottom: 50%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
        }

        .hour-hand {
            width: 8px;
            height: 70px;
            background: #000;
        }

        .minute-hand {
            width: 6px;
            height: 100px;
            background: #000;
        }

        .second-hand {
            width: 4px;
            height: 120px;
            background: #ff0000;
            z-index: 5;
        }

        .second-hand::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
        }

        .info-panel {
            margin-top: 20px;
            text-align: center;
            color: #333;
        }

        .info-item {
            margin: 10px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .info-icon {
            font-size: 20px;
        }

        /* Calendari */
        .calendar-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .calendar-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            color: #000;
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-header {
            text-align: center;
            padding: 10px 5px;
            font-weight: 600;
            color: #000;
            font-size: 14px;
            text-transform: uppercase;
        }

        .calendar-day {
            text-align: center;
            padding: 12px 5px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }

        .calendar-day.today {
            background: #ff0000;
            color: white;
            font-weight: 600;
            transform: scale(1.05);
        }

        .calendar-day.empty {
            background: transparent;
        }

        .calendar-day.other-month {
            color: #ccc;
            background: #fafafa;
        }

        @media (max-width: 767px) {
            .clock {
                width: 250px;
                height: 250px;
            }

            .marker {
                transform-origin: 50% 125px;
            }

            .hour-hand {
                height: 60px;
            }

            .minute-hand {
                height: 85px;
            }

            .second-hand {
                height: 100px;
            }

            .calendar-container {
                padding: 20px;
            }

            .calendar-day-header {
                font-size: 12px;
                padding: 8px 2px;
            }

            .calendar-day {
                padding: 10px 2px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock-container">
            <div class="clock">
                <div class="clock-face" id="clockFace"></div>
                <div class="center-dot"></div>
            </div>
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-icon">🌡️</span>
                    <span id="temperature">Carregant temperatura...</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">⛰️</span>
                    <span id="altitude">Carregant altitud...</span>
                </div>
            </div>
        </div>

        <div class="calendar-container">
            <div class="calendar-header">
                <h2 id="calendarMonth"></h2>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <script>
        // Crear marcadors del rellotge
        const clockFace = document.getElementById('clockFace');
        for (let i = 0; i < 60; i++) {
            const marker = document.createElement('div');
            marker.className = i % 5 === 0 ? 'marker hour' : 'marker';
            marker.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
            clockFace.appendChild(marker);
        }

        // Crear busques
        const clock = document.querySelector('.clock');
        const hourHand = document.createElement('div');
        hourHand.className = 'hand hour-hand';
        const minuteHand = document.createElement('div');
        minuteHand.className = 'hand minute-hand';
        const secondHand = document.createElement('div');
        secondHand.className = 'hand second-hand';

        clock.appendChild(hourHand);
        clock.appendChild(minuteHand);
        clock.appendChild(secondHand);

        // Funció Stop2Go: 58 segons de moviment, 2 segons de pausa
        let secondsProgress = 0;
        let isPaused = false;
        let pauseStartTime = 0;
